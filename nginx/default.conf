server {
    listen 80;
    server_name galeria.aycmetrologia.com;
    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ =404;
    }

    # Imágenes y videos: caché larga en el navegador y soporte de reproducción por rangos (nativo en nginx)
    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }
}
