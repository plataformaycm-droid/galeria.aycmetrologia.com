# Despliegue automático: cada push a main sincroniza el repo con /opt/aycm-galeria en el VPS
# y recarga el contenedor nginx (mismo esquema Docker que /opt/aycm-portal de clientes).
# Secrets requeridos (GitHub > Settings > Secrets and variables > Actions):
#   VPS_HOST      IP del VPS (2.25.160.230)
#   VPS_USER      usuario SSH (root)
#   VPS_SSH_KEY   llave privada exclusiva para este despliegue
#   DEPLOY_PATH   /opt/aycm-galeria
name: Deploy galeria.aycmetrologia.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-galeria
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar llave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # --delete quita del servidor lo que se borró del repo; los --exclude quedan protegidos,
      # en especial public/media/videos/ (videos subidos por SFTP, fuera de git).
      - name: Sincronizar archivos con el servidor
        run: |
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'Notas/' \
            --exclude 'public/media/videos/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Levantar / recargar nginx
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ${{ secrets.DEPLOY_PATH }} && mkdir -p public/media/videos && docker compose up -d && docker compose exec -T web nginx -s reload && curl -s -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:8081/"
