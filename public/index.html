<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Galería A&amp;CM Metrología</title>
    <link rel="icon" href="/assets/favicon.ico">
    <style>
        :root {
            --acm-navy: #27364B;
            --acm-navy-darker: #0F192A;
            --acm-cyan: #009DC5;
            --acm-cyan-pale: #BDE2EA;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            background: linear-gradient(160deg, var(--acm-navy) 0%, var(--acm-navy-darker) 100%);
            color: #e7edf3;
            font-family: Bahnschrift, Arial, sans-serif;
            text-align: center;
        }
        img { max-width: 220px; width: 60%; height: auto; }
        h1 { font-weight: 600; margin: 24px 0 8px; }
        p { color: var(--acm-cyan-pale); margin: 0; }
        a { color: var(--acm-cyan); }
    </style>
</head>
<body>
    <main>
        <img src="/assets/logo.png" alt="A&amp;CM Metrología">
        <h1>Repositorio de contenido audiovisual</h1>
        <p>Imágenes y videos de <a href="https://aycmetrologia.com">A&amp;CM Metrología</a>.</p>
    </main>
</body>
</html>
